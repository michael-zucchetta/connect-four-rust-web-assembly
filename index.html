<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="demo/connect_four.css" rel="stylesheet"/>
    <script type="module">
      import init, { create_game } from './pkg/connect_four.js';

      function initializeColumnHeights(columnsLength) {
        columnsLength = parseInt(columnsLength);
        if (columnsLength < 6 || columnsLength > 11) {
          return;
        }
        document.getElementById('column-heights-container').style.display = 'block';
        let htmlCode = [...Array(columnsLength).keys()].map(i => `
                <label class="height-field">
                  <span>${i+1}</span>
                  <input type="number" name="column-length" value="6" min="4" max="12" />
                <\/label>
            `)
          .reduce( (previousHtml, newDiv) => previousHtml + newDiv );
        document.getElementById('column-heights').innerHTML = htmlCode;
      }

      window.initializeColumnHeights = initializeColumnHeights;

      window.onload = async () => {
        await init();
        initializeColumnHeights( document.getElementsByName('numberOfColumns')[0].value );
        window.initializeGame = () => {
          let numberOfColumns = document.getElementsByName('numberOfColumns')[0].value;
          let difficulty  = document.getElementsByName('difficulty')[0].value;
          let columnLengths = Uint32Array.from(
            Array.from( document.getElementsByName('column-length') ).map( (columnInputLength) => parseInt( columnInputLength.value) )
          );
          document.getElementById('game-area').innerHTML = '';
          create_game(columnLengths, difficulty);
          document.getElementById('submit').disabled = true;
          document.getElementById('reset').hidden = false;
          document.getElementById('game-status').textContent = 'Your move';
          document.body.classList.add('game-started');
          return false;
        };
      }
    </script>
  </head>
  <body>
    <main class="terminal-window">
      <div class="terminal-bar" aria-hidden="true">
        <span>user@connect-four:/wasm/game</span>
      </div>

      <div class="app-shell">
        <section class="setup-panel" aria-label="Game setup">
          <div class="brand-lockup">
            <pre aria-label="Connect Four title">CONNECT_FOUR</pre>
            <p><span class="prompt">$</span> cargo run --release --target wasm32</p>
          </div>

          <form action="POST" onsubmit="return initializeGame()" class="setup-form">
            <label class="field">
              <span>--ai-level</span>
              <select name="difficulty">
                <option value="VeryEasy">Very Easy</option>
                <option value="Easy">Easy</option>
                <option value="Medium" selected>Medium</option>
                <option value="Hard">Hard</option>
                <option value="VeryHard">Very Hard</option>
                <option value="Extreme">Extreme</option>
              </select>
            </label>

            <label class="field">
              <span>--columns</span>
              <input type="number" name="numberOfColumns" onchange="initializeColumnHeights(this.value)" min="6" max="11" value="7" />
            </label>

            <div id="column-heights-container" class="field-group" style="display: none">
              <div class="field-group-heading">
                <span>--column-heights</span>
              </div>
              <div id="column-heights" class="height-grid"></div>
            </div>

            <div class="actions">
              <button id="submit" type="submit">./start</button>
              <button id="reset" type="button" hidden onclick="window.location.reload()">reset</button>
            </div>
          </form>
        </section>

        <section class="board-panel" aria-label="Connect Four board">
          <div class="board-toolbar">
            <span><span class="prompt">$</span> status: <b id="game-status">Ready</b></span>
            <span class="player-key"><b></b> player <i></i> cpu</span>
          </div>
          <div id="game-area" class="board-stage"></div>
        </section>
      </div>

      <footer class="status-strip" aria-hidden="true">
        <span class="status-green">WASM: loaded</span>
        <span>|</span>
        <span>mode: montecarlo</span>
        <span>|</span>
        <span class="status-cyan">runtime: browser</span>
      </footer>
    </main>
  </body>
</html>
