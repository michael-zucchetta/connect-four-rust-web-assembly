<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="./demo/connect_four.css" rel="stylesheet"/>
    <link id="theme-bundle" href="./demo/connect_four.terminal.css" rel="stylesheet"/>
    <script type="module">
      import init, { create_game, reset_game } from './demo/connect_four.js';

      const themeBundles = {
        white: './demo/connect_four.white.css',
        terminal: './demo/connect_four.terminal.css',
      };

      const showThemeSelector = new URLSearchParams(window.location.search).get('showThemeSelector') === 'true';

      function setTheme(theme) {
        const selectedTheme = themeBundles[theme] ? theme : 'white';
        document.body.dataset.theme = selectedTheme;
        document.getElementById('theme-bundle').setAttribute('href', themeBundles[selectedTheme]);
        const themeSelector = document.getElementsByName('theme')[0];
        if (themeSelector) {
          themeSelector.value = selectedTheme;
        }
        localStorage.setItem('connect-four-theme', selectedTheme);
      }

      function initializeColumnHeights(columnsLength) {
        columnsLength = parseInt(columnsLength);
        if (columnsLength < 6 || columnsLength > 11) {
          return;
        }
        document.getElementById('column-heights-container').style.display = 'block';
        let htmlCode = [...Array(columnsLength).keys()].map(i => `
                <label class="height-field">
                  <span>${i+1}</span>
                  <input type="number" name="column-length" value="6" min="4" max="12" />
                <\/label>
            `)
          .reduce( (previousHtml, newDiv) => previousHtml + newDiv );
        document.getElementById('column-heights').innerHTML = htmlCode;
      }

      function isMobileSetup() {
        return window.matchMedia('(max-width: 820px)').matches;
      }

      function setupDifficultyLabels() {
        const difficultySelect = document.getElementsByName('difficulty')[0];
        const restorePlainLabels = () => {
          Array.from(difficultySelect.options).forEach(option => {
            option.textContent = option.dataset.baseLabel;
          });
        };
        const labelSelectedDifficulty = () => {
          restorePlainLabels();
          const selectedOption = difficultySelect.selectedOptions[0];
          const algorithm = selectedOption.value.startsWith('montecarlo-') ? 'montecarlo' : 'minimax';
          selectedOption.textContent = `${selectedOption.dataset.baseLabel} (${algorithm})`;
        };

        Array.from(difficultySelect.options).forEach(option => {
          option.dataset.baseLabel = option.textContent;
        });
        difficultySelect.addEventListener('pointerdown', restorePlainLabels);
        difficultySelect.addEventListener('keydown', event => {
          if (['ArrowDown', 'ArrowUp', ' ', 'Enter'].includes(event.key)) {
            restorePlainLabels();
          }
        });
        difficultySelect.addEventListener('change', labelSelectedDifficulty);
        difficultySelect.addEventListener('blur', labelSelectedDifficulty);
        labelSelectedDifficulty();
      }

      function setSetupOpen(open) {
        const setupToggle = document.getElementById('setup-toggle');
        if (!setupToggle) {
          return;
        }

        document.body.classList.toggle('setup-open', open);
        document.body.classList.toggle('setup-closed', !open);
        setupToggle.setAttribute('aria-expanded', String(open));
        setupToggle.querySelector('.setup-toggle-arrow').textContent = open ? '↓' : '→';
      }

      function syncSetupForViewport() {
        setSetupOpen(!isMobileSetup() && !document.body.classList.contains('embedded-game'));
      }

      window.initializeColumnHeights = initializeColumnHeights;
      window.setTheme = setTheme;
      window.toggleSetup = () => {
        setSetupOpen(!document.body.classList.contains('setup-open'));
      };

      window.onload = async () => {
        const startButton = document.getElementById('submit');
        const gameStatus = document.getElementById('game-status');
        startButton.disabled = true;

        const requestedTheme = new URLSearchParams(window.location.search).get('theme');
        const productionTheme = document.body.dataset.productionTheme;
        const savedTheme = localStorage.getItem('connect-four-theme');
        const initialTheme = [requestedTheme, productionTheme, savedTheme]
          .find(theme => themeBundles[theme]) || 'white';
        setTheme(initialTheme);
        if (showThemeSelector) {
          document.getElementById('theme-field').hidden = false;
        }
        window.initializeGame = () => {
          if (startButton.disabled) {
            return false;
          }
          let numberOfColumns = document.getElementsByName('numberOfColumns')[0].value;
          let difficulty  = document.getElementsByName('difficulty')[0].value;
          let columnLengths = Uint32Array.from(
            Array.from( document.getElementsByName('column-length') ).map( (columnInputLength) => parseInt( columnInputLength.value) )
          );
          reset_game();
          document.getElementById('game-area').innerHTML = '';
          create_game(columnLengths, difficulty);
          const difficultySelect = document.getElementsByName('difficulty')[0];
          const difficultyLabel = difficultySelect.value;
          document.getElementById('game-command').textContent = `./connect-four --ai-level ${difficultyLabel} --columns ${numberOfColumns}`;
          document.getElementById('submit').disabled = true;
          document.getElementById('reset').hidden = false;
          document.body.classList.add('game-started');
          if (isMobileSetup()) {
            setSetupOpen(false);
          }
          return false;
        };

        window.resetGame = () => {
          reset_game();
          document.getElementById('game-area').innerHTML = '';
          document.getElementById('submit').disabled = false;
          document.getElementById('reset').hidden = true;
          document.getElementById('game-status').textContent = 'Ready';
          document.getElementById('game-command').textContent = './connect-four';
          document.getElementById('coin-result-toolbar').textContent = 'Not started';
          document.getElementById('game-timer').textContent = 'Time: 0 seconds';
          document.body.classList.remove('game-started');
          if (isMobileSetup()) {
            setSetupOpen(true);
          }
        };

        try {
          await init();
          setupDifficultyLabels();
          initializeColumnHeights(document.getElementsByName('numberOfColumns')[0].value);
          syncSetupForViewport();
          window.matchMedia('(max-width: 820px)').addEventListener('change', syncSetupForViewport);
          startButton.disabled = false;
        } catch (error) {
          console.error('Could not load Connect Four WebAssembly:', error);
          gameStatus.textContent = 'Load failed';
          gameStatus.title = 'Reload the page to try loading the game again.';
        }
      }
    </script>
  </head>
  <body data-production-theme="white" class="embedded-game">
    <main class="terminal-window">
      <div class="app-shell">
        <section class="setup-panel" aria-label="Game setup">
          <form onsubmit="event.preventDefault()" class="setup-form">
            <button
              id="setup-toggle"
              class="setup-toggle"
              type="button"
              aria-expanded="true"
              onclick="toggleSetup()"
            >
              <span class="setup-toggle-arrow" aria-hidden="true">↓</span>
              <span>setup</span>
            </button>

            <div class="setup-fields">
              <label id="theme-field" class="field" hidden>
                <span>bundle</span>
                <select name="theme" onchange="setTheme(this.value)">
                  <option value="white">White README</option>
                  <option value="terminal">Terminal</option>
                </select>
              </label>

              <label class="field">
                <span>--ai-level</span>
                <select name="difficulty">
                  <optgroup label="Monte Carlo">
                    <option value="montecarlo-very-easy">Very Easy</option>
                    <option value="montecarlo-easy">Easy</option>
                    <option value="montecarlo-medium" selected>Medium</option>
                    <option value="montecarlo-hard">Hard</option>
                    <option value="montecarlo-very-hard">Very Hard</option>
                    <option value="montecarlo-extreme">Extreme</option>
                  </optgroup>
                  <optgroup label="Minimax">
                    <option value="minimax-very-easy">Very Easy</option>
                    <option value="minimax-easy">Easy</option>
                    <option value="minimax-normal">Normal</option>
                    <option value="minimax-hard">Hard</option>
                    <option value="minimax-very-hard">Very Hard</option>
                    <option value="minimax-extreme">Extreme</option>
                  </optgroup>
                </select>
              </label>

              <label class="field">
                <span>--columns</span>
                <input type="number" name="numberOfColumns" onchange="initializeColumnHeights(this.value)" min="6" max="11" value="7" />
              </label>

              <div id="column-heights-container" class="field-group" style="display: none">
                <div class="field-group-heading">
                  <span>--column-heights</span>
                </div>
                <div id="column-heights" class="height-grid"></div>
              </div>
            </div>

            <div class="actions">
              <button id="submit" type="button" onclick="initializeGame()" disabled>./start</button>
              <button id="reset" type="button" hidden onclick="resetGame()">reset</button>
              <a
                class="repository-link repository-link-mobile"
                href="https://github.com/michael-zucchetta/connect-four-rust-web-assembly"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Connect Four source code on GitHub (opens in a new tab)"
              >GitHub Repo ↗</a>
            </div>

            <a
              class="repository-link"
              href="https://github.com/michael-zucchetta/connect-four-rust-web-assembly"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Connect Four source code on GitHub (opens in a new tab)"
            >GitHub Repo ↗</a>
          </form>
        </section>

        <section class="board-panel" aria-label="Connect Four board">
          <div class="board-toolbar">
            <span class="toolbar-command"><span class="prompt">$</span> <b id="game-command">./connect-four</b></span>
            <span class="toolbar-status"><b id="game-status">Ready</b><span class="mobile-status-extra"> | <b id="coin-result-toolbar">Not started</b></span></span>
            <span id="game-timer" class="toolbar-status">Time: 0 seconds</span>
            <span class="player-key"><b></b> player <i></i> cpu</span>
          </div>
          <div id="game-area" class="board-stage"></div>
        </section>
      </div>

      <footer class="status-strip" aria-hidden="true">
        <span class="status-green">WASM: loaded</span>
        <span>|</span>
        <span>mode: montecarlo</span>
        <span>|</span>
        <span class="status-cyan">runtime: browser</span>
      </footer>
    </main>
  </body>
</html>
