[package]
name = "connect_four"
version = "0.1.0"
authors = ["Michael Zucchetta <michael.zucchetta@gmail.com>"]
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = { version = "0.5.4" }
owo-colors = "4.3.0"
console_error_panic_hook = "0.1.7"
js-sys = "0.3.70"
wasm-bindgen = "0.2.127"
web-sys = { version = "0.3.70", features = ["Document", "Element", "EventTarget", "HtmlCanvasElement", "HtmlElement", "MouseEvent", "Node", "Window", "CanvasRenderingContext2d"] }
