[package]
name = "connect_four"
version = "0.2.0"
authors = ["Michael Zucchetta <michael.zucchetta@gmail.com>"]
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = { version = "0.10.2" }
owo-colors = "4.4.0"
console_error_panic_hook = "0.1.7"
js-sys = "0.3.105"
wasm-bindgen = "0.2.128"
web-sys = { version = "0.3.105", features = ["CssStyleDeclaration", "Document", "DomRect", "Element", "EventTarget", "HtmlCanvasElement", "HtmlElement", "MouseEvent", "Node", "Window", "CanvasRenderingContext2d"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
