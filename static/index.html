<!doctype html>
<html lang="en">
  <head>
    <link href="connect_four.css" rel="stylesheet"/>
    <script src="connect_four.js" type="text/javascript"></script>
    <script type="text/javascript">
      // console.log('FF ', RUST);
      function initializeColumnHeights(columnsLength) {
        columnsLength = parseInt(columnsLength);
        if (columnsLength < 6 || columnsLength > 11) {
          return;
        }
        console.log('number of columns: ', columnsLength, Array(columnsLength));
        document.getElementById('column-heights-container').style.display = 'block';
        let htmlCode = [...Array(columnsLength).keys()].map(i => `
                <div> Column n. ${i+1} height: <input name="column-length" value="6"\/> <\/div>
            `)
          .reduce( (previousHtml, newDiv) => previousHtml + newDiv );
        console.log(htmlCode, [...Array(columnsLength).keys()]);
        document.getElementById('column-heights').innerHTML = htmlCode;
      }

      function setupDifficultyLabels() {
        const difficultySelect = document.getElementsByName('difficulty')[0];
        const restorePlainLabels = () => {
          Array.from(difficultySelect.options).forEach(option => {
            option.textContent = option.dataset.baseLabel;
          });
        };
        const labelSelectedDifficulty = () => {
          restorePlainLabels();
          const selectedOption = difficultySelect.selectedOptions[0];
          const algorithm = selectedOption.value.startsWith('montecarlo-') ? 'montecarlo' : 'minimax';
          selectedOption.textContent = `${selectedOption.dataset.baseLabel} (${algorithm})`;
        };

        Array.from(difficultySelect.options).forEach(option => {
          option.dataset.baseLabel = option.textContent;
        });
        difficultySelect.addEventListener('pointerdown', restorePlainLabels);
        difficultySelect.addEventListener('keydown', event => {
          if (['ArrowDown', 'ArrowUp', ' ', 'Enter'].includes(event.key)) {
            restorePlainLabels();
          }
        });
        difficultySelect.addEventListener('change', labelSelectedDifficulty);
        difficultySelect.addEventListener('blur', labelSelectedDifficulty);
        labelSelectedDifficulty();
      }

      window.onload = () => {
        const startButton = document.getElementById('submit');
        startButton.disabled = true;
        setupDifficultyLabels();
        initializeColumnHeights( document.getElementsByName('numberOfColumns')[0].value );
        Rust.connect_four.then(connect_four => {
          window.connect_four = connect_four;
          startButton.disabled = false;
        }).catch(error => {
          console.error('Could not load Connect Four WebAssembly:', error);
          document.getElementById('submit').value = 'Game failed to load';
        });
        window.initializeGame = () => {
          if (startButton.disabled || !window.connect_four) {
            return false;
          }
          let numberOfColumns = document.getElementsByName('numberOfColumns')[0].value;
          let difficulty  = document.getElementsByName('difficulty')[0].value;
          let columnLengths = Array.from( document.getElementsByName('column-length') ).map( (columnInputLength) => parseInt( columnInputLength.value) );
          window.connect_four.create_game(columnLengths, difficulty);
          document.getElementById('submit').style.display = 'none';
          return false;
        };
      }
    </script>
  </head>
  <body>
    <div>
      <h4>Connect Four Game</h4>
      <form onsubmit="event.preventDefault()">
      <div> AI Level: 
        <select name="difficulty">
          <optgroup label="Monte Carlo">
            <option value="montecarlo-very-easy">Very Easy</option>
            <option value="montecarlo-easy">Easy</option>
            <option value="montecarlo-medium" selected>Medium</option>
            <option value="montecarlo-hard">Hard</option>
            <option value="montecarlo-very-hard">Very Hard</option>
            <option value="montecarlo-extreme">Extreme</option>
          </optgroup>
          <optgroup label="Minimax">
            <option value="minimax-very-easy">Very Easy</option>
            <option value="minimax-easy">Easy</option>
            <option value="minimax-normal">Normal</option>
            <option value="minimax-hard">Hard</option>
            <option value="minimax-very-hard">Very Hard</option>
            <option value="minimax-extreme">Extreme</option>
          </optgroup>
        </select>
      </div>
      <div>Number of columns (from a minimum of 6 to a maximum of 11. Classic game has 7):
        <input type="number" name="numberOfColumns" onchange="initializeColumnHeights(this.value)" min="6" max="11" value="7" />
      </div>
      <div id="column-heights-container" style='display: none'>
        Specify each column Sizes:
        <div id="column-heights">

        </div>
      </div>
      <div>
        Start game: <input id="submit" type="button" onclick="initializeGame()" value="Ok" disabled/>
      </div>
      </form>
    </div>
  </body>
</html>
